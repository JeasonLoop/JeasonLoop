<svg xmlns="http://www.w3.org/2000/svg" width="1306" height="240" viewBox="0 0 1306 240">
  <defs>
    <style>
      @font-face {
        font-family: 'Bmp9';
        src: url(data:font/woff2;base64,) format('woff2');
      }
      text {
        font-family: 'Bmp9', 'Courier New', monospace;
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#f4f2ec" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1306" height="240" fill="#30332f"/>
  <rect width="1306" height="240" fill="url(#grid)"/>

  <rect x="4" y="4" width="1298" height="232" fill="none" stroke="#4a4e49" stroke-width="4"/>
  <rect x="9" y="9" width="1288" height="222" fill="none" stroke="#1b1d1b" stroke-width="2"/>

  <text x="656" y="122" font-size="78" text-anchor="middle" fill="#1b1d1b">JEASONLOOP</text>
  <text x="653" y="119" font-size="78" text-anchor="middle" fill="#f4f2ec">JEASONLOOP</text>

  <text x="656" y="176" font-size="26" text-anchor="middle" fill="#1b1d1b">BUILDING BLOCK BY BLOCK...</text>
  <text x="653" y="174" font-size="26" text-anchor="middle" fill="#a7c58d">BUILDING BLOCK BY BLOCK...</text>

  <rect x="78" y="204" width="1150" height="12" fill="#3a3d38"/>
  <rect x="78" y="204" width="0" height="12" fill="#7EFC20">
    <animate attributeName="width" values="0;483" dur="1.6s" begin="0.3s" fill="freeze"/>
  </rect>
  <rect x="78" y="204" width="483" height="0" fill="#A0FF5A">
    <animate attributeName="height" values="0;4" dur="0.1s" begin="1.9s" fill="freeze"/>
